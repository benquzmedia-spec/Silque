<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Not Found — Silque Tours</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1A1A2E,#16213E);color:#fff;text-align:center;padding:2rem}
h1{font-family:'Playfair Display',serif;font-size:6rem;font-weight:900;background:linear-gradient(135deg,#FF6B35,#FFBF69);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
p{font-size:1.2rem;margin-bottom:2rem;color:rgba(255,255,255,.75)}
a{display:inline-block;padding:1rem 2rem;background:linear-gradient(135deg,#FF6B35,#FF8C42);color:#fff;text-decoration:none;border-radius:50px;font-weight:600;transition:.3s}
a:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(255,107,53,.4)}
</style>
</head>
<body>
<div>
<h1>404</h1>
<p>This adventure doesn't exist (yet).</p>
<a href="/"><i class="fas fa-home"></i> Return Home</a>
</div>
</body>
</html>
